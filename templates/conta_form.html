{% extends "base.html" %}

{% block title %}
Nova Conta - Financeiro
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Nova conta</h1>

    <p>
        Cadastre uma conta para controlar seu saldo.
    </p>

</div>


<div class="form-container">

    <form method="POST">

        <div class="form-group">

            <label for="nome">
                Nome da conta
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex.: Nubank"
                required
            >

        </div>


        <div class="form-group">

            <label for="tipo">
                Tipo
            </label>

            <select
                id="tipo"
                name="tipo"
                required
            >

                <option value="Conta corrente">
                    Conta corrente
                </option>

                <option value="Conta poupança">
                    Conta poupança
                </option>

                <option value="Carteira">
                    Carteira
                </option>

                <option value="Dinheiro">
                    Dinheiro
                </option>

                <option value="Investimentos">
                    Investimentos
                </option>

                <option value="Outro">
                    Outro
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="saldo_inicial">
                Saldo inicial
            </label>

            <div class="currency-input">
                <span class="currency-prefix">R$</span>

                <input
                    type="text"
                    id="saldo_inicial"
                    name="saldo_inicial"
                    class="currency-field"
                    inputmode="decimal"
                    autocomplete="off"
                    value="0,00"
                    required
                >
            </div>

        </div>


        <div class="actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Salvar conta
            </button>

            <a
                href="{{ url_for('contas.listar') }}"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
