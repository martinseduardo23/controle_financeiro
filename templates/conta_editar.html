{% extends "base.html" %}

{% block title %}
Editar Conta - Controle Financeiro
{% endblock %}

{% block content %}

<div class="page-header">
    <div class="page-header-content">
        <div>
            <h1>Editar Conta</h1>
            <p>Atualize as informações da conta.</p>
        </div>
        <a href="{{ url_for('contas.listar') }}" class="btn btn-secondary">
            ← Voltar para Contas
        </a>
    </div>
</div>

{% if erro %}
<div class="alert alert-danger">
    {{ erro }}
</div>
{% endif %}

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome da conta</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ conta.nome }}"
                placeholder="Ex.: Nubank"
                required
            >
        </div>

        <div class="form-group">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
                {% for tipo_opcao in ["Conta corrente", "Conta poupança", "Carteira", "Dinheiro", "Investimentos", "Outro"] %}
                <option value="{{ tipo_opcao }}" {% if conta.tipo == tipo_opcao %}selected{% endif %}>
                    {{ tipo_opcao }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="saldo_inicial">Saldo inicial</label>
            <div class="currency-input">
                <span class="currency-prefix">R$</span>
                <input
                    type="text"
                    id="saldo_inicial"
                    name="saldo_inicial"
                    class="currency-field"
                    inputmode="decimal"
                    autocomplete="off"
                    value="{{ conta.saldo_inicial|moeda }}"
                    required
                >
            </div>
        </div>

        <div class="form-group form-check">
            <label class="checkbox-container">
                <input type="checkbox" name="ativa" id="ativa" {% if conta.ativa %}checked{% endif %}>
                <span class="checkmark"></span>
                Conta ativa (exibir nos resumos e cálculos)
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Salvar Alterações
            </button>
            <a href="{{ url_for('contas.listar') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
