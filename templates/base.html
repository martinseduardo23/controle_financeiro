<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Financeiro
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="app-layout">


    <!-- =====================================================
         MENU LATERAL
    ====================================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo">

            💰

            <span>
                Financeiro
            </span>

        </div>


        <!-- MENU -->

        <nav class="menu">


            <!-- DASHBOARD -->

            <a
                href="{{ url_for('dashboard.dashboard') }}"
            >
                🏠 Dashboard
            </a>


            <!-- CONTAS -->

            <a
                href="{{ url_for('contas.listar') }}"
            >
                🏦 Contas
            </a>


            <!-- LANÇAMENTOS -->

            <a
                href="{{ url_for('lancamentos.listar') }}"
            >
                💰 Lançamentos
            </a>


            <!-- CATEGORIAS -->

            <a
                href="{{ url_for('categorias.listar') }}"
            >
                📂 Categorias
            </a>


            <!-- CARTÕES -->

            <a
                href="{{ url_for('cartoes.listar') }}"
            >
                💳 Cartões
            </a>


            <!-- COMPRAS NO CARTÃO -->

            <a
                href="{{ url_for('compras_cartao.listar') }}"
            >
                🛒 Compras no cartão
            </a>


            <!-- FATURAS -->

            <a
                href="{{ url_for('faturas_cartao.listar') }}"
            >
                🧾 Faturas dos cartões
            </a>


            <!-- METAS -->

            <a
                href="{{ url_for('metas.listar') }}"
            >
                🎯 Metas
            </a>


            <!-- RELATÓRIOS -->

            <a href="#">
                📊 Relatórios
            </a>


        </nav>


    </aside>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">


        {% block content %}

        {% endblock %}


    </main>


</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


</body>

</html>
